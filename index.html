<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 핀치 줌 금지 + 노치 영역까지 화면 사용(viewport-fit=cover) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05050f" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="모바일 퍼스트 네온 아케이드 게임" />
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA: 홈 화면에 추가하면 전체 화면 앱처럼 실행 -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Neon Dodge" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />

    <title>Neon Dodge</title>
    <!-- CSS 파일이 도착하기 전에도 첫 화면을 어둡게 (홈 화면 앱 실행 시 흰 화면 번쩍임 방지) -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05050f;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="게임 화면"></canvas>
    </div>
    <noscript>이 게임을 하려면 JavaScript를 켜 주세요.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
