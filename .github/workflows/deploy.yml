# main 브랜치에 push 할 때마다 자동으로 빌드해서 GitHub Pages에 배포합니다.
# 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source를 "GitHub Actions"로 바꾸세요.
# 배포 주소: https://<아이디>.github.io/<저장소이름>/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      # package-lock.json을 커밋해 두었다면 `npm ci`로 바꾸면 더 빠르고 안정적입니다.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build (타입 검사 + 번들 + 서비스 워커)
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
